services:
  erp-api:
    image: registry.digitalocean.com/munyaal-docr/legacy/mono-api:1c18c55
    container_name: erp-api-prod
    ports:
      - "4000:3000"
    volumes:
      - ./public:/app/public
      - erp-storage:/app/storage
    environment:
      - NODE_ENV=production
      - API_SECRET=${API_SECRET}
      - API_MAIL=${API_MAIL}
      - API_MAIL_PASSWORD=${API_MAIL_PASSWORD}
      - DB_DBNAME_CONNECTION=${DB_DBNAME_CONNECTION}
      - DB_DBNAME=${DB_DBNAME}
      - DB_USERNAME=${DB_USERNAME}
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_PORT=${DB_PORT}
      - DB_HOST=${DB_HOST}
      - INVOICES_PATH=/app/storage/
      - S3_REGION=${S3_REGION:-us-east-1}
      - S3_BUCKET_NAME=${S3_BUCKET_NAME}
      - S3_ACCESS_KEY_ID=${S3_ACCESS_KEY_ID}
      - S3_SECRET_ACCESS_KEY=${S3_SECRET_ACCESS_KEY}
      - S3_FOLDER=${S3_FOLDER}
    restart: unless-stopped

volumes:
  erp-storage: