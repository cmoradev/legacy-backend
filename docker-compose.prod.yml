services:
  erp-api:
    build:
      context: .
      dockerfile: Dockerfile.prod
    container_name: erp-api-prod
    ports:
      - "${API_PORT:-3000}:3000"
    volumes:
      - ./public:/app/public
      - erp-storage:/app/storage
    environment:
      - NODE_ENV=production
      - API_PORT=3000
      - API_AUTH_ENABLED=${API_AUTH_ENABLED:-true}
      - API_SECRET=${API_SECRET}
      - API_MAIL=${API_MAIL}
      - API_MAIL_PASSWORD=${API_MAIL_PASSWORD}
      - DB_DBNAME_CONNECTION=${DB_DBNAME_CONNECTION}
      - DB_DBNAME=${DB_DBNAME}
      - DB_USERNAME=${DB_USERNAME}
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_PORT=${DB_PORT}
      - DB_HOST=${DB_HOST}
      - DB_SYNCHRONIZE=${DB_SYNCHRONIZE:-false}
      - INVOICES_PATH=/app/storage/
      - XSLT=/app/storage/xslt/4.0/cadenaoriginal.xslt
      - ASSETS_PATH=/app/storage/
      - UPLOADS_PATH=/app/storage/uploads/
    restart: unless-stopped

volumes:
  erp-storage: