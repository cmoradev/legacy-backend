services:
  erp-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: erp-api-dev
    ports:
      - "3000:3000"
    volumes:
      - ./src:/app/src
      - ./public:/app/public
      - ./storage:/app/storage
    network_mode: host
    env_file:
      - .env
    environment:
      - NODE_ENV=development
      - API_SECRET=${API_SECRET}
      - DB_DBNAME_CONNECTION=${DB_DBNAME_CONNECTION}
      - DB_DBNAME=${DB_DBNAME}
      - DB_USERNAME=${DB_USERNAME}
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_PORT=${DB_PORT}
      - DB_HOST=${DB_HOST}
      - INVOICES_PATH=/app/storage/
      - S3_REGION=${S3_REGION:-us-east-1}
      - S3_BUCKET_NAME=${S3_BUCKET_NAME}
      - S3_ACCESS_KEY_ID=${S3_ACCESS_KEY_ID}
      - S3_SECRET_ACCESS_KEY=${S3_SECRET_ACCESS_KEY}
      - S3_FOLDER=${S3_FOLDER}
      - AMQP_SERVERS=amqp://127.0.0.1:5672
    restart: unless-stopped